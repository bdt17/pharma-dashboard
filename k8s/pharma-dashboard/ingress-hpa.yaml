apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pharma-hpa
  namespace: pharma-transport
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pharma-dashboard
  minReplicas: 3
  maxReplicas: 24
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharma-ingress
  namespace: pharma-transport
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "pharma-cert"
    kubernetes.io/ingress.global-static-ip-name: "pharma-ip"
spec:
  rules:
  - host: pharmatransport.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pharma-service
            port:
              number: 80
