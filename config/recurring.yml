# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Payment-recovery follow-up emails for subscriptions Stripe is still
  # retrying. See DunningSweepJob / Subscription#dunning_email_due?.
  dunning_sweep:
    class: DunningSweepJob
    schedule: every day at 9am

  # Trim the webhook delivery log to WebhookDelivery::RETENTION.
  purge_old_webhook_deliveries:
    command: "WebhookDelivery.expired.in_batches.delete_all"
    schedule: every day at 4am

  # Warn admins once when the subscription's card is close to expiring.
  card_expiry_check:
    class: CardExpiryCheckJob
    schedule: every day at 8am
