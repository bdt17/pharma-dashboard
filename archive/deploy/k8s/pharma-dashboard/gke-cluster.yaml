apiVersion: v1
kind: Namespace
metadata:
  name: pharma-transport
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pharma-config
  namespace: pharma-transport
data:
  RAILS_ENV: production
  DATABASE_URL: "postgresql://pharma:securepass@pharma-db-rw.pharma-transport.svc.cluster.local:5432/pharma_production"
  REDIS_URL: "redis://pharma-redis.pharma-transport.svc.cluster.local:6379"
  GPS_API_KEY: "sk_test_your_twilio_gps_key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharma-dashboard
  namespace: pharma-transport
spec:
  replicas: 6
  selector:
    matchLabels:
      app: pharma-dashboard
  template:
    metadata:
      labels:
        app: pharma-dashboard
    spec:
      containers:
      - name: pharma-dashboard
        image: gcr.io/your-gcp-project-id/pharma-dashboard:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: pharma-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
