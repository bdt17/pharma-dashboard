name: DEA Compliance Audit
on: [push, deployment]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.5
    - run: ./script/audit/test_production_pdf_v4.rb
      env:
        PHARMA_API_TOKEN: ${{ secrets.PHARMA_API_TOKEN }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dea-compliance-pdfs
        path: script/audit/*.pdf
