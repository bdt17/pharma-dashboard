<!DOCTYPE html>
<html style="background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%) !important; margin: 0 !important; padding: 0 !important;">
<head>
  <title>Pharma Transport Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { 
      all: revert !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      box-sizing: border-box !important; 
    }
    html, body { 
      background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%) !important;
      color: #FFFFFF !important;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif !important;
      min-height: 100vh !important;
    }
    a { color: #60BDD1 !important; text-decoration: none !important; }
    .glass { 
      background: rgba(255,255,255,0.08) !important; 
      backdrop-filter: blur(20px) !important; 
      border: 1px solid rgba(9,132,192,0.3) !important;
      border-radius: 1.5rem !important;
    }
  </style>
</head>
<body>
  <div style="max-width: 1200px; margin: 2rem auto; padding: 0 2rem;">
    
    <!-- HERO -->
    <div class="glass" style="padding: 4rem 3rem; text-align: center; margin-bottom: 3rem;">
      <div style="font-size: 5rem; margin-bottom: 1rem;">💉</div>
      <h1 style="font-size: 3.2rem; font-weight: 900; color: #FFFFFF !important; margin-bottom: 1rem;">Pharma Transport</h1>
      <p style="color: #C0BEC6 !important; font-size: 1.4rem; margin-bottom: 2.5rem;">Phase 14 LIVE • 24 GPS Vehicles • 127 Batches</p>
      <a href="https://www.pharmatransport.org/" style="background: linear-gradient(90deg, #0984C0, #60BDD1) !important; color: #FFFFFF !important; padding: 1.5rem 4rem; border-radius: 1.5rem; font-size: 1.3rem; font-weight: 800; box-shadow: 0 20px 40px rgba(9,132,192,0.5) !important;">
        🚀 Launch Platform
      </a>
    </div>
    
    <!-- METRICS -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem;">
      
      <div class="glass" style="padding: 3rem 2.5rem; text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">🚛</div>
        <h3 style="color: #C0BEC6 !important; font-size: 1.3rem; margin-bottom: 1rem;">Live Vehicles</h3>
        <div style="font-size: 4rem; font-weight: 900; color: #60BDD1 !important;">24</div>
        <p style="color: #AAA7B0 !important;">GPS Tracked</p>
      </div>
      
      <div class="glass" style="padding: 3rem 2.5rem; text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">📦</div>
        <h3 style="color: #C0BEC6 !important; font-size: 1.3rem; margin-bottom: 1rem;">Active Batches</h3>
        <div style="font-size: 4rem; font-weight: 900; color: #0984C0 !important;">127</div>
        <p style="color: #AAA7B0 !important;">FDA Compliant</p>
      </div>
      
      <div class="glass" style="padding: 3rem 2.5rem; text-align: center; background: rgba(255,213,0,0.15) !important; border: 2px solid #FFD700 !important;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">💰</div>
        <h3 style="color: #C0BEC6 !important; font-size: 1.3rem; margin-bottom: 1rem;">Revenue</h3>
        <div style="font-size: 4rem; font-weight: 900; color: #FFD700 !important;">$12K</div>
        <p style="color: #D4AF37 !important;">Phase 14</p>
      </div>
    </div>
    
  </div>
</body>
</html>
